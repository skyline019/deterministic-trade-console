global:
  resolve_timeout: 5m

route:
  receiver: local-log
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local-log
    # Demo sink: webhook to a no-op can be added later. Logs appear in Alertmanager UI/stdout.
    webhook_configs:
      - url: http://127.0.0.1:9/dev-null
        send_resolved: true
        max_alerts: 10
