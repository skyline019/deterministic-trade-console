# Loaded by Compose Prometheus (ops/prometheus/prometheus.yml). Not by the app JVM.
groups:
  - name: deterministic-trade
    rules:
      - alert: TradeHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[2m]))
            /
          clamp_min(sum(rate(http_server_requests_seconds_count[2m])), 1)
            > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx ratio > 5% for 2m"

      - alert: TradeLockUnavailable
        expr: |
          sum(rate(trade_order_requests_total{outcome="LOCK_UNAVAILABLE"}[2m])) > 0.1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis lock fail-closed rate elevated (availability impact)"

      - alert: TradeOutOfStockSpike
        expr: |
          sum(rate(trade_order_requests_total{outcome="OUT_OF_STOCK"}[2m])) > 5
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Elevated OUT_OF_STOCK — capacity or contention, not necessarily a fault"

      # Lab-friendly window so scripts/obs-alert-drill.sh can prove Alertmanager path.
      - alert: TradeInstanceDown
        expr: up{job="deterministic-trade"} == 0
        for: 20s
        labels:
          severity: critical
        annotations:
          summary: "deterministic-trade Prometheus scrape target down (app or METRICS_READ token)"
