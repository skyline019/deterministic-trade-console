name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  architecture-and-core:
    name: ArchUnit + jtest (verify)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Full Maven verify (ArchUnit + JUnit + jtest)
        run: ./mvnw -B -e verify
      - name: Fail if tracked secrets or junk slipped in
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)ops/secrets/\.env$|\.pem$|\.key$|id_rsa'; then
            echo 'Refusing tracked secret-like paths' >&2
            exit 1
          fi
          if git ls-files | grep -E '^(target/|frontend/node_modules/|frontend/dist/|frontend/test-results/|frontend/playwright-report)'; then
            echo 'Refusing build artifacts in git' >&2
            exit 1
          fi

  vue-console:
    name: Vue unit + build + Demo E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Vue unit tests
        run: npm test
      - name: Strict type check and production build
        run: npm run build
      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium
      - name: Playwright Demo E2E (explicit; not same-origin evidence)
        run: npm run test:e2e:demo
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7

  mysql-redis-concurrency:
    name: Integration (MySQL + Redis Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Real MySQL and Redis concurrency contracts
        run: ./mvnw -B -e -Pintegration verify

  # Gate job: branch protection can require this single check.
  ci-ok:
    name: CI green
    runs-on: ubuntu-latest
    needs: [architecture-and-core, vue-console, mysql-redis-concurrency]
    steps:
      - name: All required jobs passed
        run: echo 'architecture-and-core + vue-console + mysql-redis-concurrency OK'
