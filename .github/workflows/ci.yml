name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs (e.g. to validate the Compose job from a feature branch before merging).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  architecture-and-core:
    name: ArchUnit + jtest (verify)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Full Maven verify (ArchUnit + JUnit + jtest)
        run: ./mvnw -B -e verify
      - name: Fail if tracked secrets or junk slipped in
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)ops/secrets/\.env$|\.pem$|\.key$|id_rsa'; then
            echo 'Refusing tracked secret-like paths' >&2
            exit 1
          fi
          if git ls-files | grep -E '^(target/|frontend/node_modules/|frontend/dist/|frontend/test-results/|frontend/playwright-report)'; then
            echo 'Refusing build artifacts in git' >&2
            exit 1
          fi

  vue-console:
    name: Vue unit + build + Demo E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Vue unit tests
        run: npm test
      - name: Strict type check and production build
        run: npm run build
      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium
      - name: Playwright Demo E2E (explicit; not same-origin evidence)
        run: npm run test:e2e:demo
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7

  mysql-redis-concurrency:
    name: Integration (MySQL + Redis Testcontainers, migrations, archive)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Migrations, archive relocation and concurrency contracts
        run: ./mvnw -B -e -Pintegration verify

  # ---------------------------------------------------------------------------------------------
  # Everything below needs a real container runtime, which a developer laptop or a restricted
  # sandbox may not have. These are the checks that cannot be reproduced by `mvn verify` alone:
  # the production image build, the Compose wiring (TLS terminator + cookie delivery), the scripts
  # operators actually run (smoke / contend / maintenance one-shots) and both non-Demo E2E suites.
  # ---------------------------------------------------------------------------------------------
  compose-stack:
    name: Compose stack (smoke + contention + maintenance + same-origin/cookie E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Matches docker-compose.yml defaults so the scripts and the stack agree.
      BOOTSTRAP_ADMIN_PASSWORD: local-admin-only
      # Public endpoints: the image defaults target regional mirrors for constrained networks.
      NPM_REGISTRY: https://registry.npmjs.org
      MAVEN_SETTINGS: ops/maven/settings-central.xml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the production images (frontend build + real migrations)
        run: docker compose build
      - name: Boot the stack (mysql + redis + app + caddy)
        run: docker compose up -d
      - name: Wait for application health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "application healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo 'application never became healthy' >&2
          docker compose ps
          docker compose logs --no-color app
          exit 1
      - name: Smoke — idempotency, ledger, audit chain, token revoke
        run: ./scripts/smoke.sh http://127.0.0.1:8080
      - name: Contention — exactly 50x201 + 50x409 with the ledger conserved
        run: ./scripts/contend.sh http://127.0.0.1:8080
      - name: Maintenance — archive relocation, expiry sweep, V6 index
        run: ./scripts/ci-maintenance-check.sh http://127.0.0.1:8080
      - name: Install locked frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Seed operator/viewer/auditor for the role scenarios
        run: ./scripts/seed_same_origin_users.sh
      - name: Same-origin E2E — static UI served by Boot, Bearer over :8080
        working-directory: frontend
        run: npm run test:e2e:same-origin
      - name: Cookie E2E — __Host- session + CSRF over Caddy TLS :8443
        working-directory: frontend
        run: npm run test:e2e:https-cookie
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-e2e-diagnostics
          path: |
            frontend/test-results
            frontend/playwright-report-same-origin
            frontend/playwright-report-https-cookie
          retention-days: 7
      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 500

  # Gate job: branch protection can require this single check.
  ci-ok:
    name: CI green
    runs-on: ubuntu-latest
    needs: [architecture-and-core, vue-console, mysql-redis-concurrency, compose-stack]
    steps:
      - name: All required jobs passed
        run: echo 'architecture-and-core + vue-console + mysql-redis-concurrency + compose-stack OK'
