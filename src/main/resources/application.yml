server:
  port: ${PORT:8080}
  shutdown: graceful
  # Fail-closed default: a client-supplied X-Forwarded-For must never rewrite the request peer,
  # because AuthHandler fingerprints the login throttle on that peer (spoofing it would grant a fresh
  # attempt budget per username). Set TRADE_FORWARD_HEADERS_STRATEGY=framework only when every request
  # arrives through a trusted proxy (Compose + Caddy); cookie TLS checks read X-Forwarded-Proto directly.
  forward-headers-strategy: ${TRADE_FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: deterministic-trade
  lifecycle:
    timeout-per-shutdown-phase: 15s
  datasource:
    # MYSQL_TLS_PARAMS defaults to the local/lab profile only; managed MySQL should set e.g.
    # MYSQL_TLS_PARAMS='sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=...' (no cleartext fallback).
    url: "jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:trade}?${MYSQL_TLS_PARAMS:useSSL=false&allowPublicKeyRetrieval=true}&serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true"
    username: ${MYSQL_USER:trade}
    password: ${MYSQL_PASSWORD:trade}
    hikari:
      # Pool sizing is part of the stated performance protocol (docs/performance.md).
      maximum-pool-size: ${DB_POOL_SIZE:32}
      minimum-idle: ${DB_MIN_IDLE:4}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:1000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:0}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Lock acquire/release and login throttle fail-closed when this budget is exceeded.
      timeout: ${REDIS_TIMEOUT:2s}
  sql:
    init:
      # Schema evolves only via Flyway. Keep spring.sql.init off in all environments.
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Fail-closed: a non-empty database without schema history must not be silently adopted at v1,
    # which would skip every migration. Opt in explicitly for a one-off legacy adoption.
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true

logging:
  pattern:
    # CorrelationIdFilter puts X-Request-Id into MDC key requestId.
    level: "%5p [${spring.application.name:},%X{requestId:-}]"

trade:
  lock-ttl: ${TRADE_LOCK_TTL:10s}
  transaction-timeout-seconds: ${TRADE_TX_TIMEOUT_SECONDS:5}
  # Bounded Redis I/O retries before fail-closed (does not retry contention / empty lock).
  lock-retry-attempts: ${TRADE_LOCK_RETRY_ATTEMPTS:3}
  lock-retry-backoff: ${TRADE_LOCK_RETRY_BACKOFF:50ms}
  # How long a RESERVED order may wait before expire-reservations cancels it (same ledger as cancel).
  reservation-ttl: ${TRADE_RESERVATION_TTL:1h}
  security:
    # Prefer shorter TTL in hostile browser environments; XSS can still read in-memory Bearer tokens.
    token-ttl: ${ACCESS_TOKEN_TTL:8h}
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    login-attempt-limit: ${LOGIN_ATTEMPT_LIMIT:10}
    login-window: ${LOGIN_WINDOW:5m}
    api-attempt-limit: ${API_ATTEMPT_LIMIT:300}
    api-window: ${API_WINDOW:1m}
    # Cookie delivery (__Host-TradeSession) requires TLS terminator; Compose Caddy sets this true.
    cookie:
      secure: ${TRADE_COOKIE_SECURE:false}
    # Optional external-style AuthN (JWT → Actor). Default off; opaque Bearer remains primary.
    # mode=hs256 uses hs256-secret; mode=jwks uses inline jwks-json (static fixture / operator-supplied).
    jwt:
      enabled: ${TRADE_JWT_ENABLED:false}
      mode: ${TRADE_JWT_MODE:hs256}
      hs256-secret: ${TRADE_JWT_HS256_SECRET:}
      jwks-json: ${TRADE_JWT_JWKS_JSON:}
    # When false, POST /auth/token is forbidden; callers must present JWT (requires jwt.enabled).
    password-login:
      enabled: ${TRADE_PASSWORD_LOGIN_ENABLED:true}
    bootstrap-admin-username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  # Explicit one-shot maintenance (AR-006: no @Scheduled).
  # Set trade.maintenance.command=purge-tokens|archive-audit|checkpoint-audit|expire-reservations for ops runs.
  maintenance:
    exit-after: ${TRADE_MAINTENANCE_EXIT_AFTER:true}
    batch-size: ${TRADE_MAINTENANCE_BATCH_SIZE:500}
    audit-quiet-before: ${TRADE_MAINTENANCE_AUDIT_QUIET_BEFORE:P30D}
    checkpoint-min-events: ${TRADE_MAINTENANCE_CHECKPOINT_MIN_EVENTS:500}
